[project]
name = "MoveMatch"
version = "0.1.0"
description = "Watch the sequence. Reproduce the moves. Let AI decide who got it right."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "gunicorn>=22.0",
    "requests>=2.31",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
movematch = "app:app"
